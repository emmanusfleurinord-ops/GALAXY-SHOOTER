<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Shooter</title>
<style>
  html,body{margin:0;height:100%;background:#02010a;color:#c8f7ff;font-family:"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  #boot{text-align:center;letter-spacing:2px}
</style>
</head>
<body>
<div id="boot">CARREGANDO GALAXY SHOOTER…</div>
<script>
(async () => {
  const SRC = "https://cdn.jsdelivr.net/gh/emmanusfleurinord-ops/GALAXY-SHOOTER@ee50df77bb73e462b7041bc9c7973f2f66a54156/index.html";
  const FALLBACK = "https://raw.githubusercontent.com/emmanusfleurinord-ops/GALAXY-SHOOTER/ee50df77bb73e462b7041bc9c7973f2f66a54156/index.html";
  async function load(url){
    const r = await fetch(url, {cache:"force-cache"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }
  let html;
  try { html = await load(SRC); }
  catch(e){ html = await load(FALLBACK); }

  const oldMake = `function makeBoss(n){\n  const hue=(n*47+13)%360, move=(n*3+1)%12, body=(n*5)%12;\n  const atk = n===1 ? 0 : n===2 ? 1 : n===3 ? 2 : (n*5+2)%12;\n  return { name:N1[(n-1)%20]+" "+N2[(n*3)%20]+" "+N3[(n*11)%20], hue, move, atk, body,\n    moveName:MOVE_NAME[move], atkName:ATK_NAME[atk], w:130+(n%7)*8, h:150+(n%5)*8 };\n}`;

  const newMake = `function uniqueTriple(id,a,b,c){\n  const n=a*b*c; id=((id%n)+n)%n;\n  return [Math.floor(id/(b*c))%a, Math.floor(id/c)%b, id%c];\n}\nfunction bossesBefore(n){\n  n=n|0; const cyc=Math.floor((n-1)/4), r=(n-1)%4;\n  return cyc*10 + (r===0?0:r===1?1:r===2?3:6);\n}\nfunction makeBoss(n, idx){\n  idx=idx|0;\n  const id=bossesBefore(n)+idx;\n  const [a,b,c]=uniqueTriple(id,N1.length,N2.length,N3.length);\n  const hue=(id*137.508+19)%360;\n  const move=id%MOVE_NAME.length;\n  const atk=id%ATK_NAME.length;\n  const body=id%24;\n  const variant=Math.floor(id/24);\n  return {\n    id, n, idx, name:N1[a]+" "+N2[b]+" "+N3[c],\n    hue, move, atk, body, variant,\n    moveName:MOVE_NAME[move], atkName:ATK_NAME[atk],\n    w:116+(id%10)*6, h:136+(id%8)*7\n  };\n}`;

  function patch(html){
    const makeRe = /function makeBoss\(n\)\{[\s\S]*?w:130\+\(n%7\)\*8, h:150\+\(n%5\)\*8 \};\n\}/;
    const drawRe = /function drawUniqueBoss\(\)\{[\s\S]*?ctx\.restore\(\);\n\}/;
    if(!makeRe.test(html) || !drawRe.test(html) || html.indexOf("L.boss=makeBoss(L.n*13 + bossIndex*17);")<0){
      throw new Error("codigo antigo nao encontrado");
    }
    html = html.replace(makeRe, newMake);
    html = html.replace("n, boss:makeBoss(n),", "n, boss:makeBoss(n,0),");
    html = html.replace("L.boss=makeBoss(L.n*13 + bossIndex*17);", "L.boss=makeBoss(L.n, bossIndex);");
    const drawFn = [
      "function hsl(h,s,l,a){ return a==null?('hsl('+((h|0))+' '+s+'% '+l+'%)'):('hsla('+((h|0))+' '+s+'% '+l+'% / '+a+')'); }",
      "function drawUniqueBoss(){",
      "  const B=L.boss, x=boss.x, y=boss.y, w=boss.w, h=boss.h;",
      "  const id=B.id|0, hue=B.hue||0, body=B.body|0, variant=B.variant|0;",
      "  const cx=x+w/2, cy=y+h*0.42;",
      "  ctx.save();",
      "  ctx.shadowColor=hsl(hue,80,55,0.45); ctx.shadowBlur=16;",
      "  ctx.translate(cx, cy);",
      "  const pulse=1+Math.sin(tick*0.08+id)*0.015;",
      "  ctx.scale(pulse, pulse);",
      "  const h1=hue, h2=(hue+48+(variant%5)*18)%360, h3=(hue+210)%360;",
      "  const hull=hsl(h1,72,42), hullD=hsl(h1,78,22), accent=hsl(h2,85,58), glass=hsl(h3,70,72), edge=hsl(h1,40,88);",
      "  function wing(k){",
      "    ctx.beginPath();",
      "    if(k===0){ ctx.moveTo(0,-h*0.08); ctx.lineTo(-w*0.48,h*0.18); ctx.lineTo(-w*0.12,h*0.08); ctx.lineTo(w*0.12,h*0.08); ctx.lineTo(w*0.48,h*0.18); }",
      "    else if(k===1){ ctx.moveTo(-w*0.08,-h*0.18); ctx.lineTo(-w*0.52,h*0.02); ctx.lineTo(-w*0.18,h*0.16); ctx.lineTo(w*0.18,h*0.16); ctx.lineTo(w*0.52,h*0.02); ctx.lineTo(w*0.08,-h*0.18); }",
      "    else if(k===2){ ctx.moveTo(0,-h*0.22); ctx.quadraticCurveTo(-w*0.55,h*0.02,0,h*0.2); ctx.quadraticCurveTo(w*0.55,h*0.02,0,-h*0.22); }",
      "    else if(k===3){ ctx.moveTo(-w*0.46,-h*0.02); ctx.lineTo(-w*0.16,-h*0.2); ctx.lineTo(w*0.16,-h*0.2); ctx.lineTo(w*0.46,-h*0.02); ctx.lineTo(w*0.22,h*0.16); ctx.lineTo(-w*0.22,h*0.16); }",
      "    else if(k===4){ ctx.moveTo(0,-h*0.16); ctx.lineTo(-w*0.38,-h*0.04); ctx.lineTo(-w*0.5,h*0.14); ctx.lineTo(-w*0.1,h*0.1); ctx.lineTo(w*0.1,h*0.1); ctx.lineTo(w*0.5,h*0.14); ctx.lineTo(w*0.38,-h*0.04); }",
      "    else if(k===5){ ctx.moveTo(-w*0.5,0); ctx.bezierCurveTo(-w*0.2,-h*0.28,w*0.2,-h*0.28,w*0.5,0); ctx.bezierCurveTo(w*0.18,h*0.22,-w*0.18,h*0.22,-w*0.5,0); }",
      "    else if(k===6){ ctx.moveTo(0,-h*0.24); ctx.lineTo(-w*0.18,-h*0.02); ctx.lineTo(-w*0.46,h*0.18); ctx.lineTo(0,h*0.08); ctx.lineTo(w*0.46,h*0.18); ctx.lineTo(w*0.18,-h*0.02); }",
      "    else { ctx.moveTo(-w*0.42,-h*0.12); ctx.lineTo(0,-h*0.26); ctx.lineTo(w*0.42,-h*0.12); ctx.lineTo(w*0.28,h*0.18); ctx.lineTo(0,h*0.1); ctx.lineTo(-w*0.28,h*0.18); }",
      "    ctx.closePath();",
      "  }",
      "  const wk=variant%8;",
      "  ctx.fillStyle=hullD; wing(wk); ctx.fill();",
      "  ctx.strokeStyle=edge; ctx.lineWidth=2; ctx.stroke();",
      "  ctx.fillStyle=hull;",
      "  ctx.beginPath();",
      "  const fam=body%24;",
      "  if(fam<4){",
      "    ctx.moveTo(0,-h*0.36); ctx.lineTo(w*0.16,-h*0.08); ctx.lineTo(w*0.12,h*0.28); ctx.lineTo(0,h*0.36); ctx.lineTo(-w*0.12,h*0.28); ctx.lineTo(-w*0.16,-h*0.08);",
      "  } else if(fam<8){",
      "    ctx.moveTo(-w*0.22,-h*0.18); ctx.lineTo(w*0.22,-h*0.18); ctx.lineTo(w*0.28,h*0.08); ctx.lineTo(w*0.1,h*0.32); ctx.lineTo(-w*0.1,h*0.32); ctx.lineTo(-w*0.28,h*0.08);",
      "  } else if(fam<12){",
      "    ctx.ellipse(0,0,w*0.28,h*0.3,0,0,Math.PI*2);",
      "  } else if(fam<16){",
      "    ctx.moveTo(0,-h*0.32); ctx.lineTo(w*0.3,0); ctx.lineTo(0,h*0.32); ctx.lineTo(-w*0.3,0);",
      "  } else if(fam<20){",
      "    ctx.moveTo(-w*0.26,-h*0.08); ctx.bezierCurveTo(-w*0.08,-h*0.38,w*0.08,-h*0.38,w*0.26,-h*0.08); ctx.lineTo(w*0.18,h*0.28); ctx.lineTo(0,h*0.22); ctx.lineTo(-w*0.18,h*0.28);",
      "  } else {",
      "    ctx.moveTo(-w*0.12,-h*0.34); ctx.lineTo(w*0.12,-h*0.34); ctx.lineTo(w*0.22,-h*0.04); ctx.lineTo(w*0.14,h*0.3); ctx.lineTo(-w*0.14,h*0.3); ctx.lineTo(-w*0.22,-h*0.04);",
      "  }",
      "  ctx.closePath(); ctx.fill(); ctx.strokeStyle=accent; ctx.lineWidth=2.2; ctx.stroke();",
      "  ctx.fillStyle=glass;",
      "  ctx.beginPath();",
      "  const ck=Math.floor(id/3)%4;",
      "  if(ck===0) ctx.ellipse(0,-h*0.08,w*0.08,h*0.1,0,0,Math.PI*2);",
      "  else if(ck===1){ ctx.moveTo(0,-h*0.2); ctx.lineTo(w*0.09,-h*0.02); ctx.lineTo(0,h*0.04); ctx.lineTo(-w*0.09,-h*0.02); ctx.closePath(); }",
      "  else if(ck===2) ctx.arc(0,-h*0.06,Math.min(w,h)*0.09,0,Math.PI*2);",
      "  else { ctx.moveTo(-w*0.1,-h*0.16); ctx.lineTo(w*0.1,-h*0.16); ctx.lineTo(w*0.1,0); ctx.lineTo(-w*0.1,0); ctx.closePath(); }",
      "  ctx.fill();",
      "  ctx.strokeStyle=hsl(h3,40,95); ctx.lineWidth=1.4; ctx.stroke();",
      "  const guns=1+(id%4);",
      "  ctx.fillStyle=accent;",
      "  for(let i=0;i<guns;i++){",
      "    const gx=(i-(guns-1)/2)*w*0.16;",
      "    ctx.fillRect(gx-3,h*0.18,6,h*0.16);",
      "    ctx.fillStyle=hsl(h2,90,70);",
      "    ctx.fillRect(gx-2,h*0.30,4,6);",
      "    ctx.fillStyle=accent;",
      "  }",
      "  const pods=(id%3);",
      "  for(let i=0;i<pods;i++){",
      "    const px=(i?1:-1)*w*(0.22+0.06*(id%3));",
      "    ctx.beginPath(); ctx.arc(px,h*0.02,7+(id%4),0,Math.PI*2); ctx.fillStyle=hsl((hue+90+i*40)%360,80,50); ctx.fill();",
      "  }",
      "  ctx.strokeStyle=hsl(hue,90,80,0.85); ctx.lineWidth=1.5;",
      "  ctx.beginPath();",
      "  const mark=id%5;",
      "  if(mark===0){ ctx.moveTo(-w*0.08,h*0.08); ctx.lineTo(0,h*0.2); ctx.lineTo(w*0.08,h*0.08); }",
      "  else if(mark===1){ ctx.arc(0,h*0.1,8,0,Math.PI*2); }",
      "  else if(mark===2){ ctx.moveTo(-6,h*0.06); ctx.lineTo(6,h*0.18); ctx.moveTo(6,h*0.06); ctx.lineTo(-6,h*0.18); }",
      "  else if(mark===3){ ctx.rect(-8,h*0.06,16,10); }",
      "  else { ctx.moveTo(0,h*0.04); ctx.lineTo(0,h*0.2); }",
      "  ctx.stroke();",
      "  ctx.fillStyle=hsl((hue+180)%360,90,70);",
      "  ctx.beginPath(); ctx.arc(-w*0.18,-h*0.18,3+(id%3),0,Math.PI*2); ctx.arc(w*0.18,-h*0.18,3+(id%3),0,Math.PI*2); ctx.fill();",
      "  ctx.restore();",
      "}"
    ].join("\n");
    html = html.replace(drawRe, drawFn);
    return html;
  }

  try {
    html = patch(html);
  } catch(e){
    document.getElementById("boot").textContent = "Nao achei o codigo antigo para aplicar a correcao.";
    return;
  }
  document.open();
  document.write(html);
  document.close();
})().catch(err => {
  const el = document.getElementById("boot");
  if(el) el.textContent = "Erro ao carregar o jogo: " + err.message;
});
</script>
</body>
</html>
