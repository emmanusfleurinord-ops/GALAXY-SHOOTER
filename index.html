<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Shooter</title>
<style>
  html,body{margin:0;height:100%;background:#02010a;color:#c8f7ff;font-family:"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  #boot{text-align:center;letter-spacing:2px}
</style>
</head>
<body>
<div id="boot">CARREGANDO GALAXY SHOOTER…</div>
<script>
(async () => {
  const SRC = "https://cdn.jsdelivr.net/gh/emmanusfleurinord-ops/GALAXY-SHOOTER@ee50df77bb73e462b7041bc9c7973f2f66a54156/index.html";
  const FALLBACK = "https://raw.githubusercontent.com/emmanusfleurinord-ops/GALAXY-SHOOTER/ee50df77bb73e462b7041bc9c7973f2f66a54156/index.html";
  async function load(url){
    const r = await fetch(url, {cache:"force-cache"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }
  let html;
  try { html = await load(SRC); }
  catch(e){ html = await load(FALLBACK); }

  const css = [
    "#touchUI { display:none; position:absolute; inset:0; z-index:6; pointer-events:none; }",
    "body.show-touch #touchUI { display:block; }",
    "#stickBox { pointer-events:auto; position:absolute; left:12px; bottom:18px; width:120px; height:120px; border-radius:50%; background:rgba(0,30,50,.35); border:2px solid rgba(80,220,255,.35); }",
    "#stickKnob { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:rgba(120,230,255,.55); border:2px solid #9ff; }",
    "#btnFire { pointer-events:auto; position:absolute; right:16px; bottom:28px; width:86px; height:86px; border-radius:50%; border:3px solid #6ff; background:rgba(0,180,220,.32); color:#eaffff; font-weight:800; letter-spacing:1px; font-size:13px; }",
    "#btnFire.on { background:rgba(0,255,180,.45); }",
    "#touchHint { position:absolute; left:0; right:0; bottom:4px; text-align:center; font-size:10px; color:#8df; opacity:.8; pointer-events:none; }"
  ].join("\n  ");
  html = html.replace("</style>", "  " + css + "\n</style>");

  const touchHtml = '<div id="touchUI"><div id="stickBox"><div id="stickKnob"></div></div><button id="btnFire" type="button">ATIRAR</button><div id="touchHint">Celular: use os botoes na tela. Controle USB/Bluetooth so se o navegador aceitar.</div></div>';
  html = html.replace('<div id="toast"></div>', '<div id="toast"></div>\n  ' + touchHtml);

  const newMake = [
    "function uniqueTriple(id,a,b,c){",
    "  const n=a*b*c; id=((id%n)+n)%n;",
    "  return [Math.floor(id/(b*c))%a, Math.floor(id/c)%b, id%c];",
    "}",
    "function bossesBefore(n){",
    "  n=n|0; const cyc=Math.floor((n-1)/4), r=(n-1)%4;",
    "  return cyc*10 + (r===0?0:r===1?1:r===2?3:6);",
    "}",
    "function bossSpriteKeys(){",
    "  const keys=['boss','bossA','bossB','bossC','bossD','bossE','bossF'];",
    "  for(let i=0;i<=26;i++) keys.push('ship'+i);",
    "  return keys;",
    "}",
    "function makeBoss(n, idx){",
    "  idx=idx|0;",
    "  const id=bossesBefore(n)+idx;",
    "  const [a,b,c]=uniqueTriple(id,N1.length,N2.length,N3.length);",
    "  const keys=bossSpriteKeys();",
    "  const sprite=keys[id%keys.length];",
    "  const flip=Math.floor(id/keys.length)%2===1;",
    "  const hue=(id*37+11)%360;",
    "  const move=id%MOVE_NAME.length;",
    "  const atk = (n===1&&idx===0)?0:(n===2&&idx===0)?1:(n===3&&idx===0)?2:(id%ATK_NAME.length);",
    "  const body=id%12;",
    "  return {",
    "    id, n, idx, sprite, flip, name:N1[a]+' '+N2[b]+' '+N3[c],",
    "    hue, move, atk, body,",
    "    moveName:MOVE_NAME[move], atkName:ATK_NAME[atk],",
    "    w:130+(id%7)*8, h:150+(id%5)*8",
    "  };",
    "}"
  ].join("\n");

  const newDraw = [
    "function drawUniqueBoss(){",
    "  const B=L.boss, x=boss.x, y=boss.y, w=boss.w, h=boss.h;",
    "  const keys=bossSpriteKeys();",
    "  const key=B.sprite || keys[(B.id||0)%keys.length];",
    "  const img=IMG[key] || IMG.boss || IMG.enemy;",
    "  ctx.save();",
    "  const hue=((B.hue%360)+360)%360;",
    "  ctx.filter='hue-rotate('+hue+'deg) saturate(1.06) contrast(1.08)';",
    "  ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=14;",
    "  if(B.flip){",
    "    ctx.translate(x+w, y); ctx.scale(-1,1);",
    "    if(img && img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, w, h);",
    "    else { ctx.fillStyle='#889'; ctx.fillRect(0,0,w,h); }",
    "  } else if(img && img.complete && img.naturalWidth) ctx.drawImage(img, x, y, w, h);",
    "  else { ctx.fillStyle='#889'; ctx.fillRect(x,y,w,h); }",
    "  ctx.filter='none'; ctx.shadowBlur=0;",
    "  ctx.restore();",
    "}"
  ].join("\n");

  const makeRe = /function makeBoss\(n\)\{[\s\S]*?w:130\+\(n%7\)\*8, h:150\+\(n%5\)\*8 \};\n\}/;
  const drawRe = /function drawUniqueBoss\(\)\{[\s\S]*?ctx\.restore\(\);\n\}/;
  if(!makeRe.test(html) || !drawRe.test(html)){
    document.getElementById("boot").textContent = "Nao achei o codigo antigo para aplicar a correcao.";
    return;
  }
  html = html.replace(makeRe, newMake);
  html = html.replace("n, boss:makeBoss(n),", "n, boss:makeBoss(n,0),");
  html = html.replace("L.boss=makeBoss(L.n*13 + bossIndex*17);", "L.boss=makeBoss(L.n, bossIndex);");
  html = html.replace(drawRe, newDraw);
  html = html.replace("mx+=pad.mx; my+=pad.my;", "mx+=pad.mx + (touchCtl.mx||0); my+=pad.my + (touchCtl.my||0);");
  html = html.replace("cfg.auto||pad.shoot;", "cfg.auto||pad.shoot||touchCtl.shoot;");
  html = html.replace("function draw(){", "function draw(){ syncTouchUI();");
  html = html.replace("showOnly(ovStart); loop();", "setupTouch(); showOnly(ovStart); loop();");

  const touchJs = [
    "const touchCtl={mx:0,my:0,shoot:false,active:false};",
    "function isTouchDevice(){ return (window.matchMedia && (window.matchMedia('(pointer:coarse)').matches || window.matchMedia('(hover:none)').matches)) || ('ontouchstart' in window); }",
    "function syncTouchUI(){ const on=isTouchDevice() && (state==='play'||state==='boss'||state==='warn'); document.body.classList.toggle('show-touch', on); if(!on){ touchCtl.mx=0; touchCtl.my=0; if(!touchCtl.hold) touchCtl.shoot=false; } }",
    "function setupTouch(){",
    "  const box=document.getElementById('stickBox'); const knob=document.getElementById('stickKnob'); const fire=document.getElementById('btnFire');",
    "  if(!box||!fire) return;",
    "  const setStick=(cx,cy)=>{ const r=box.getBoundingClientRect(); const px=cx-(r.left+r.width/2), py=cy-(r.top+r.height/2); const max=r.width*0.38; const len=Math.sqrt(px*px+py*py)||1; const k=Math.min(1,max/len); const x=px*k, y=py*k; touchCtl.mx=Math.max(-1,Math.min(1,x/max)); touchCtl.my=Math.max(-1,Math.min(1,y/max)); knob.style.left=(40+x)+'px'; knob.style.top=(40+y)+'px'; };",
    "  const endStick=()=>{ touchCtl.mx=0; touchCtl.my=0; knob.style.left='40px'; knob.style.top='40px'; };",
    "  box.addEventListener('touchstart', e=>{ e.preventDefault(); setStick(e.changedTouches[0].clientX,e.changedTouches[0].clientY); }, {passive:false});",
    "  box.addEventListener('touchmove', e=>{ e.preventDefault(); setStick(e.changedTouches[0].clientX,e.changedTouches[0].clientY); }, {passive:false});",
    "  box.addEventListener('touchend', e=>{ e.preventDefault(); endStick(); }, {passive:false});",
    "  const down=e=>{ e.preventDefault(); touchCtl.shoot=true; touchCtl.hold=true; fire.classList.add('on'); };",
    "  const up=e=>{ e.preventDefault(); touchCtl.shoot=false; touchCtl.hold=false; fire.classList.remove('on'); };",
    "  fire.addEventListener('touchstart', down, {passive:false});",
    "  fire.addEventListener('touchend', up, {passive:false});",
    "  fire.addEventListener('mousedown', down);",
    "}",
    ""
  ].join("\n");
  html = html.replace("function boot()", touchJs + "function boot()");

  document.open();
  document.write(html);
  document.close();
})().catch(err => {
  const el = document.getElementById("boot");
  if(el) el.textContent = "Erro ao carregar o jogo: " + err.message;
});
</script>
</body>
</html>
